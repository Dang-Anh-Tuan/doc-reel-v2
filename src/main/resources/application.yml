spring:
  application:
    name: docreel
  config:
    # Bí mật (ELEVENLABS_API_KEY, DB_PASSWORD, ...) nằm trong .env ở thư mục chạy app, không commit.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${DB_NAME:docreel}
    username: ${DB_USER:docreel}
    password: ${DB_PASSWORD:docreel}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    level: "%5p [jobId=%X{jobId:-}]"   # NEEDS P11 #6: mỗi dòng log có jobId (MDC)

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

docreel:
  dirs:
    inbox: ${DOCREEL_HOME:.}/inbox
    requests: ${DOCREEL_HOME:.}/requests
    work: ${DOCREEL_HOME:.}/work
    done: ${DOCREEL_HOME:.}/done
    failed: ${DOCREEL_HOME:.}/failed
    duplicate: ${DOCREEL_HOME:.}/duplicate
  tools:
    ffmpeg: ${FFMPEG_PATH:ffmpeg}
    ffprobe: ${FFPROBE_PATH:ffprobe}
  self-check:
    interval: PT15M                 # chạy lại self-check định kỳ (PLAN 2.6)
  tts:
    # 25/11/2026: chỉ dùng ElevenLabs (gói Starter, giọng Ngọc Anh). Tạm bỏ edge-tts vì dịch vụ Microsoft
    # trả NoAudioReceived chập chờn với giọng vi-VN. fallback = primary → hết quota thì job FAILED (lệch SPEC mục 8,
    # người dùng đã duyệt). Có phương án dự phòng mới thì đổi lại fallback.
    primary: elevenlabs
    fallback: elevenlabs
    elevenlabs:
      api-key: ${ELEVENLABS_API_KEY:}
      base-url: https://api.elevenlabs.io
      model: eleven_flash_v2_5
      voice-id: "2VozU7Otb8AvGqzNAtnE"  # Ngọc Anh (warm and clear), đã chọn ở G2
      speed: 1.0                      # voice_settings.speed, 0.7–1.2
      # P8b: đọc tiếng Việt tự nhiên. Đổi sang model không hỗ trợ field nào thì để rỗng field đó
      # (vd eleven_v3/v4: thử send-context: false nếu bị 400; multilingual_v2 không hỗ trợ tiếng Việt).
      language-code: vi               # buộc ngôn ngữ + chuẩn hóa theo tiếng Việt
      stability: 0.4                  # thấp = biểu cảm hơn, cao = đều đều (mặc định ElevenLabs 0.5)
      similarity-boost: 0.8
      style: 0.2
      speaker-boost: true
      text-normalization: "on"        # Flash mặc định tắt → đọc số kém; giữ ngoặc kép
      send-context: true              # gửi previous_text / next_text để nối câu liền mạch
      apply-lexicon: false            # ElevenLabs đọc được từ tiếng Anh; lexicon chỉ cho edge-tts
      # P13b: ước tính chi phí mỗi video (số thật cả tháng: thẻ "ElevenLabs tháng này" / GET /api/tts/usage).
      # Chỉnh credits-per-char khi so được với credit thật (Flash có thể ~0.5).
      credits-per-char: 1.0
      usd-per-credit: 0.0002          # Starter: 6 USD / 30.000 credit
    edge:
      command: edge-tts               # hoặc đường dẫn đầy đủ tới edge-tts(.exe)
      voice: vi-VN-HoaiMyNeural       # hoặc vi-VN-NamMinhNeural
      rate: "+0%"                     # --rate, vd "+10%"
      pause-between-calls-ms: 300
  pipeline:
    poll-interval: PT10S
    retry-backoff: PT30S,PT2M
  inbox:
    poll-interval: PT10S
  youtube:
    client-id: ${YOUTUBE_CLIENT_ID:}
    client-secret: ${YOUTUBE_CLIENT_SECRET:}
    encryption-key: ${YOUTUBE_TOKEN_ENCRYPTION_KEY:${YOUTUBE_ENCRYPTION_KEY:}}
    token-file: data/youtube-token.enc
    max-attempts: 3
    retry-backoff: PT2S
