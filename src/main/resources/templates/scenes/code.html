<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
  <meta charset="utf-8">
  <title>code</title>
  <link rel="stylesheet" href="../../static/css/base.css">
  <link rel="stylesheet" id="theme-css" href="../../static/css/themes/midnight-brass.css">
  <script defer src="../../static/vendor/highlight/highlight.min.js"></script>
  <script defer src="../../static/js/slide.js"></script>
</head>
<body class="scene scene--code" data-index="5" data-total="10"
      th:attr="data-index=${index},data-total=${total}">

<header class="chrome" th:replace="~{layout :: chrome}">
  <div class="progress" data-progress></div>
  <div class="chrome-row"><span class="track-chip">React</span><span class="topic-id">R-08</span></div>
</header>

<main class="stage stage--code">
  <h1 class="h-title" th:replace="~{layout :: heading}"><span class="pill">Return sớm</span> <span>trước Hook</span></h1>

  <figure class="code-win card anim-in" style="--order:1">
    <div class="code-head">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="lang-tag" th:text="${scene.lang}">tsx</span>
    </div>
    <span class="file-tab" th:text="${scene.file}">Profile.tsx</span>
    <pre class="code" data-code data-fit="code" data-max-lines="8" data-lang="tsx" data-highlight="2,3"
         th:attr="data-lang=${scene.lang},data-highlight=${scene.highlight}"><code th:text="${scene.code}">function Profile({ user }) {
  if (!user) return null;
  const [tab, setTab] =
    useState('info');
  return &lt;Tabs value={tab} /&gt;;
}</code></pre>
  </figure>

  <aside class="note note--warn anim-in" style="--order:2" th:if="${scene.note != null}"
         th:attr="class=${'note anim-in note--' + (scene.noteKind ?: 'info')}">
    <span class="note-label">
      <svg class="ic ic-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      <svg class="ic ic-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2.8 19.5h18.4z"/><path d="M12 10v4.2M12 17h.01"/></svg>
      <svg class="ic ic-tip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.4 10.9c.6.4.9 1 .9 1.7V16h5v-.4c0-.7.3-1.3.9-1.7A6 6 0 0 0 12 3z"/></svg>
      <span th:text="${scene.noteKind == 'warn' ? 'Lưu ý' : (scene.noteKind == 'tip' ? 'Mẹo' : 'Ghi nhớ')}">Lưu ý</span>
    </span>
    <p class="note-text" data-fit="note" th:text="${scene.note}">Lần đầu 0 Hook, lần sau 1 Hook: React báo lỗi</p>
  </aside>
</main>

</body>
</html>
