# PostgreSQL cho DocReel (dev). Biến lấy từ môi trường / .env, có giá trị mặc định cho máy dev.
services:
  postgres:
    image: postgres:16-alpine
    container_name: docreel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-docreel}
      POSTGRES_USER: ${DB_USER:-docreel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-docreel}
    ports:
      - "${DB_PORT:-55432}:5432"   # cổng host 55432: tránh đụng Postgres cài sẵn trên máy (5432)
    volumes:
      - docreel-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  docreel-pgdata:
